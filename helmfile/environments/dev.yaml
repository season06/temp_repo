replicaCount: 2
image:
  tag: latest
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
hostname: test.example.com
certSecret: wildcard-tls
certificate:
  dnsNames:
    - example.com
    - '*.example.com'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dev