services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    # env_file: .env
    environment:
      PORT: "8080"
      SIDECAR_TEST_URL: "http://sidecar-test:8000"
    # depends_on:
    #   sidecar-test:
    #     condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/console/templates"]
      interval: 10s
      timeout: 5s
      retries: 3

