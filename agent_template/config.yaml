# ============================
# Agent Configuraion
# ============================

agent:
  provider: deepagent
  system_prompt: "your are a helpful agent"

# ============================
# Tools Configuraion
# ============================

# skill = deepagent 原生 skill(非 tool);path 指向含 SKILL.md 的來源目錄
skills__local:
  - name: make-a-joke
    path: "./skills"      # 來源目錄,內含 make-a-joke/SKILL.md

skills__remote:
  registry_url: ""
  name: []

mcps__local:
  - name: test-func
    transport: stdio
    path: "./mcp/local_server.py"  # like @tool
    func: ["get"]
  - name: test-server
    transport: streamable_http
    path: "http://localhost:9222/mcp"  # run server
    func: ["get"]

mcps__remote:
  registry_url: ""
  name: []