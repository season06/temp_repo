[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-demo"
version = "0.1.0"
description = "Minimal deepagents demo compiled with Nuitka and shipped as a wheel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
]

[dependency-groups]
dev = [
    "nuitka>=2.4",
    "build>=1.2",
]

# The wheel ships ONLY the Nuitka-compiled .so, never the source .py.
# only-include points at build/ (all gitignored, so nothing is auto-selected) —
# this drops the root agent_demo.py. The build hook (hatch_build.py) then adds
# the actual compiled .so by glob and sets the platform tag.
[tool.hatch.build.targets.wheel]
only-include = ["build"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
