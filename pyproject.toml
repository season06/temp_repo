[project]
name = "agent-template"
version = "0.1.0"
description = "讓開發者快速建立 agent 的 library"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6,<0.7",
    "langchain-openai>=1,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
    "mcp>=1.28,<2",  # adapters 0.3.x 尚未支援 mcp 2.0
    "pydantic>=2,<3",
    "pyyaml>=6",
    "python-dotenv>=1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]
